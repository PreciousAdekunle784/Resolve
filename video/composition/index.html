<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resolve — product demo composition</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { setup, renderFrame } from "./main.js";
  window.setup = setup;
  window.renderFrame = renderFrame;
  // Preview in a normal browser: ?layout=9x16&t=12.5
  const q = new URLSearchParams(location.search);
  if (q.has("t")) setup(q.get("layout") ?? "16x9").then(() => renderFrame(Math.round(Number(q.get("t")) * 30)));
</script>
</body>
</html>
